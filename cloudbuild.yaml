# ─────────────────────────────────────────────────────────────────────────────
# cloudbuild.yaml
# Google Cloud Build pipeline for Cloud Run deployment
#
# Triggered automatically on git push to main branch.
# Set up trigger in: Cloud Console → Cloud Build → Triggers
#
# Required substitution variables (set in Cloud Build trigger UI):
#   _REGION          : Cloud Run region, e.g. asia-south1
#   _SERVICE_NAME    : Cloud Run service name, e.g. compliance-auditor
#   _DB_SECRET_NAME  : Secret Manager secret holding DATABASE_URL
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  _REGION: asia-south1
  _SERVICE_NAME: compliance-auditor
  _DB_SECRET_NAME: DATABASE_URL

steps:
  # Step 1: Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    id: "build"
    args:
      - build
      - --tag
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA
      - --tag
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest
      - --cache-from
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest
      - .

  # Step 2: Push image to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    id: "push"
    args:
      - push
      - --all-tags
      - gcr.io/$PROJECT_ID/${_SERVICE_NAME}

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "deploy"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --timeout=300
      # Audio audits run in a background thread after the upload request returns.
      # Keep CPU allocated outside requests so that thread isn't starved.
      - --no-cpu-throttling
      # Inject all secrets from Secret Manager (the app refuses to start without FLASK_SECRET_KEY)
      - --set-secrets=DATABASE_URL=${_DB_SECRET_NAME}:latest,FLASK_SECRET_KEY=FLASK_SECRET_KEY:latest,ADMIN_USERNAME=ADMIN_USERNAME:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest,GROQ_API_KEY=GROQ_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest
      # All other env vars (non-secret) set here or via Cloud Run console
      - --set-env-vars=PYTHONUNBUFFERED=1

images:
  - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/${_SERVICE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
